[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "massai-networked-simulation-reference-agent"
version = "0.1.0"
description = "Dependency-free reference autonomy workload for MassAI Networked Simulation Infrastructure"
requires-python = ">=3.11"
authors = [{name = "MassAI Networked Simulation Infrastructure contributors"}]

[project.scripts]
networked-simulation-agent-demo = "networked_simulation_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
